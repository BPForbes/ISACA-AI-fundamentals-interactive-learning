# Cloudflare Worker that stores study progress for the ISACA AI Fundamentals
# adventure and, optionally, writes scenes with Workers AI. No secret belongs
# in this file: set SYNC_TOKEN_SHA256 with `wrangler secret put`.
name = "isaca-quest-sync"
main = "src/index.ts"
compatibility_date = "2026-10-01"
workers_dev = true

[vars]
# Comma-separated origins allowed to call the API (the GitHub Pages site and local dev).
ALLOWED_ORIGINS = "https://bpforbes.github.io,http://localhost:5173"
AI_MODEL = "@cf/meta/llama-3.1-8b-instruct"

[[d1_databases]]
binding = "DB"
database_name = "isaca-quest"
# Replace with the id printed by `wrangler d1 create isaca-quest`.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

# Remove this block to turn off cloud scene generation.
[ai]
binding = "AI"
